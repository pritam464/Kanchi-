name: Build KANCHI APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install buildozer Cython==0.29.36
      - run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: kanchi-apk
          path: bin/*.apk
